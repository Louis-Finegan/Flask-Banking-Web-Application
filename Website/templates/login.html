{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="card auth-card">
  <p class="eyebrow">WELCOME BACK</p><h1>Log in to your account</h1>
  <p class="muted">Explore your balance, transfers and recent activity.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input id="username" name="username" maxlength="100" autocomplete="username" required value="{{ request.form.get('username', '') }}">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" maxlength="256" autocomplete="current-password" required>
    <button type="submit">Log in</button>
  </form>
  <p class="auth-link">New here? <a href="{{ url_for('auth.register') }}">Create a demo account</a></p>
</section>
{% endblock %}
